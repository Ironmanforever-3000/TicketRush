spring:
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:ticketrush-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

server:
  shutdown: graceful

app:
  jwt:
    issuer: ticketrush-api
    secret-base64: dGVzdC1vbmx5LXNlY3JldC10ZXN0LW9ubHktc2VjcmV0LXRlc3Qtb25seS1zZWNyZXQ=
    access-token-expiration: 900
  ticket:
    secret: "test-ticket-secret-32-bytes-long-123456"
  checkin:
    opens-before-start: PT3H
    closes-after-start: PT12H
  outbox:
    publisher-enabled: true
    poll-delay-ms: 500
    batch-size: 100
    lease-seconds: 30
  events:
    stream: ticketrush:events
    dead-letter-stream: ticketrush:dead-letter
    max-length: 100000
  worker:
    enabled: false
    autostart: true
    concurrency: 2
    max-deliveries: 5
    sweep-delay-ms: 5000
    max-attempts: 3
    base-delay-ms: 250
    max-delay-ms: 10000
    pending-idle-seconds: 30
    idempotency-ttl-days: 14
