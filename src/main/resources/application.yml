spring:
  application:
    name: ticketrush
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: jdbc:postgresql://localhost:5433/ticketrush?options=-c%20TimeZone%3DUTC
    username: ticketrush
    password: ticketrush_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

app:
  jwt:
    issuer: ticketrush-api
    secret-base64: "eW91ci0yNTYtYml0LXNlY3JldC15b3VyLTI1Ni1iaXQtc2VjcmV0" # base64 of "your-256-bit-secret-your-256-bit-secret"
    access-token-expiration: 900
  ticket:
    secret: ${TICKET_SECRET:ticket-secret-must-be-at-least-32-bytes-long!}
  checkin:
    opens-before-start: PT3H
    closes-after-start: PT12H
  outbox:
    publisher-enabled: true
    poll-delay-ms: 500
    batch-size: 100
  events:
    stream: ticketrush:events
    dead-letter-stream: ticketrush:dead-letter
    max-length: 100000
  worker:
    enabled: false              # true only in the worker process
    autostart: true             # tests switch this off
    concurrency: 2
    max-deliveries: 3           # crash redeliveries before dead-letter
    sweep-delay-ms: 5000
    max-attempts: 5
    base-delay-ms: 250
    max-delay-ms: 10000
    pending-idle-seconds: 30
    idempotency-ttl-days: 14
