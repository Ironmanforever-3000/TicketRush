services:
  postgres:
    image: postgres:16
    container_name: ticketrush-postgres

    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush_password
      TZ: UTC

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:

