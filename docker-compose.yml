services:
  postgres:
    image: postgres:16
    container_name: ticketrush-postgres
    command: ["postgres", "-c", "max_connections=300"]

    environment:
      POSTGRES_DB: ticketrush
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: ticketrush_password
      TZ: UTC

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7.4-alpine
    container_name: ticketrush-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    container_name: ticketrush-worker
    command: ["java", "-jar", "app.jar", "--spring.profiles.active=worker"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticketrush
      SPRING_DATASOURCE_USERNAME: ticketrush
      SPRING_DATASOURCE_PASSWORD: ticketrush_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
    stop_grace_period: 40s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
