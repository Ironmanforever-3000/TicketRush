# nginx.conf — in front of both API instances
# Deliberately omitted session affinity (ip_hash):
# Each browser holds a persistent WebSocket connection, which is already pinned
# to whichever backend instance accepted the initial handshake for the life of that connection.
# Updates are fanned out to all instances via Redis Pub/Sub, so any backend can publish an update
# and all connected clients across every instance receive it in real time, making session affinity unnecessary.

upstream ticketrush_api {
    server api:8080;
    server api-b:8081;
}

server {
    listen 80;

    location /ws {
        proxy_pass http://ticketrush_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;    # default nginx timeout (60s) would silently kill idle sockets between heartbeats
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://ticketrush_api;
        proxy_set_header Host $host;
    }
}
